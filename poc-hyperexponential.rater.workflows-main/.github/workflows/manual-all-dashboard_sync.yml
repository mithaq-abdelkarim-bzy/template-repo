name: Manual - All - Dashboard Sync

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:

  refresh-dashboard:
    strategy:
      matrix:
        environment: ["us-dev", "us-tst", "us-prd"]
      fail-fast: true
      max-parallel: 1
    name: refresh-dashboard - ${{ matrix.environment }}
    uses: beazley/poc-hyperexponential.rater.workflows/.github/workflows/reusable-all-dashboard_sync.yml@main
    with:
      ENVIRONMENT: ${{ matrix.environment }}
    secrets:
      HX_AZURE_AD_CLIENTSECRET: ${{ secrets.HX_AZURE_AD_CLIENTSECRET }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      READ_GITHUB_REPO_PAT: ${{ secrets.READ_GITHUB_REPO_PAT }}