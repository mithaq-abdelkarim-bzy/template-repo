name: Manual - TEMP - Create Change Request

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy'
        required: true
        type: string
      release_notes:
        description: 'Release notes'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "main"
      
      # ... deployment steps ...

  create-change:
    name: Create Change Request
    needs: deploy
    if: always()  # Create change request regardless of deployment outcome
    uses: beazley/servicenow-change/.github/workflows/create-change.yml@v1
    with:
      version: ${{ inputs.version }}
      release-notes: ${{ inputs.release_notes }}
      job-status: ${{ needs.deploy.result }}
      service-now-service-offering: "Hyperexponential Rater - Portfolio Underwriting"
      service-now-configuration-item: "Hyperexponential Renew Prd"
      service-now-business-service: "Rating Support Services"
    secrets: inherit






